
<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage-Me</title>
    <script>
        // Force unregister Service Worker and clear caches in development/preview environments to prevent stale code crashing the preview
        (function() {
            var hostname = window.location.hostname;
            var isDev = hostname === 'localhost' || 
                        hostname === '127.0.0.1' || 
                        hostname.indexOf('-dev-') !== -1 || 
                        hostname.indexOf('-pre-') !== -1 ||
                        hostname.indexOf('run.app') !== -1;
            
            if (isDev) {
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.getRegistrations().then(function(registrations) {
                        if (registrations && registrations.length > 0) {
                            console.log('Clearing service workers in dev/preview mode...');
                            for (var i = 0; i < registrations.length; i++) {
                                registrations[i].unregister().catch(function(e) {});
                            }
                        }
                    });
                }
                if (window.caches) {
                    caches.keys().then(function(keys) {
                        if (keys && keys.length > 0) {
                            console.log('Clearing caches in dev/preview mode...');
                            for (var j = 0; j < keys.length; j++) {
                                caches.delete(keys[j]).catch(function(e) {});
                            }
                        }
                    });
                }
            }
        })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preload" href="https://cdn.jsdelivr.net/gh/manthib/Typhaine@master/Site/maheer/assets/font/KohinoorBangla-Regular.ttf" as="font" type="font/ttf" crossorigin="anonymous">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Kohinoor Bangla"', 'sans-serif'],
                    },
                },
            },
        }
    </script>
    <style>
        /* Force Light Mode for Form Elements */
        :root {
            color-scheme: light;
        }
        
        body {
            font-family: 'Kohinoor Bangla', sans-serif !important;
            background-color: #f8fafc;
            /* Ensure native overscroll (rubber-banding) works on Android */
            overscroll-behavior-y: auto;
        }
        
        /* Ensure inputs always render in light mode (fixes mobile dark mode issues) */
        input, select, textarea {
            color-scheme: light;
        }

        .bg-brand-purple { background-color: #6366f1; }
        .text-brand-purple { color: #6366f1; }
        .border-brand-purple { border-color: #6366f1; }
        
        /* Date picker icon visibility improvement */
        input[type="date"]::-webkit-calendar-picker-indicator {
            cursor: pointer;
            filter: invert(0.4);
            transition: filter 0.2s;
        }
        input[type="date"]::-webkit-calendar-picker-indicator:hover {
            filter: invert(0.2);
        }

        /* Hide scrollbar for Chrome, Safari and Opera */
        ::-webkit-scrollbar {
            display: none;
        }
        /* Hide scrollbar for IE, Edge and Firefox */
        html {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
    </style>
<link rel="stylesheet" href="/index.css">
    <link rel="manifest" href="/manifest.json">
</head>
<body>
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
